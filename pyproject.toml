[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nebius-xword"
version = "0.1.0"
description = "Nebius-XWord: an LLM crossword-solving agent built on Nebius AI Studio"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=2.45,<3",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "langgraph>=1.2,<2",
    "langchain-openai>=1.4,<2",
    "langchain-core>=1.5,<2",
]

[project.optional-dependencies]
web = [
    "uvicorn>=0.30",
]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "httpx>=0.27",
    "nebius-xword[web]",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nebius_xword"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py310"
