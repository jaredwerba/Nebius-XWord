[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nebius-xword"
version = "0.1.0"
description = "Nebius-XWord: an LLM crossword-solving agent built on Nebius AI Studio"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nebius_xword"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py310"
